name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/splash-screen @capacitor/camera

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add and sync Android
        run: |
          npx cap add android
          npm install -g @capacitor/assets
          mkdir -p assets
          cp public/icon-192.png assets/icon.png
          npx capacitor-assets generate
          npx cap sync android

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks \
          -alias ndere \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass ndere123 \
          -keypass ndere123 \
          -dname "CN=Joram, OU=Dev, O=NdereSocial, L=Kampala, S=Uganda, C=UG"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=ndere123 \
            -Pandroid.injected.signing.key.alias=ndere \
            -Pandroid.injected.signing.key.password=ndere123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ndere-social-apk
          path: android/app/build/outputs/apk/release/app-release.apk
