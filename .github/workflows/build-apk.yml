name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor
        run: |
  npx cap add android
  npm install -g sharp-cli
  mkdir -p android/app/src/main/res/mipmap-hdpi
  mkdir -p android/app/src/main/res/mipmap-xhdpi
  mkdir -p android/app/src/main/res/mipmap-xxhdpi
  mkdir -p android/app/src/main/res/mipmap-xxxhdpi
  sharp -i public/icon-192.png -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png resize 72 72
  sharp -i public/icon-192.png -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png resize 96 96
  sharp -i public/icon-192.png -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png resize 144 144
  sharp -i public/icon-192.png -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png resize 192 192
  npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ndere-social-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
